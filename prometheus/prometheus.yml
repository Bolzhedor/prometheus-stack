global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: "blackbox"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://prometheus:9090
          - http://alertmanager:9093
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: "clickhouse"
    metrics_path: /metrics
    scheme: http
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 'clickhouse-1:9363'
          - 'clickhouse-2:9363'
          - 'clickhouse-3:9363'
        labels:
          cluster: 'clickhouse-prod'
          shard_group: '3shards_1replica'

  - job_name: "manticore"
    metrics_path: /metrics
    scheme: http
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 'manticore-1:9308'
          - 'manticore-2:9308'
          - 'manticore-3:9308'
        labels:
          cluster: 'manticore-prod'
          service: 'search'

  - job_name: "patroni"
    metrics_path: /metrics
    scheme: http
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "postgresql-patroni-pg1:8008"
          - "postgresql-patroni-pg2:8008"
          - "postgresql-patroni-pg3:8008"
        labels:
          cluster: "patroni-postgres"
          service: "patroni"

  - job_name: "etcd"
    metrics_path: /metrics
    scheme: http
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "postgresql-patroni-etcd1:2379"
          - "postgresql-patroni-etcd2:2379"
          - "postgresql-patroni-etcd3:2379"
        labels:
          cluster: "patroni-postgres"
          service: "etcd"

  - job_name: "haproxy"
    metrics_path: /metrics
    scheme: http
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "postgresql-patroni-haproxy:7000"
        labels:
          cluster: "patroni-postgres"
          service: "haproxy"

  - job_name: "k3s-api-blackbox"
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - k3s-control:6443
        labels:
          cluster: "k3s-lab"
          service: "k3s-api"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: "cadvisor"
    metrics_path: /metrics
    scheme: http
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "cadvisor:8080"
        labels:
          cluster: "docker-host"
          service: "cadvisor"
